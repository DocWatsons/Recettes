<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8590C">
<title>Mes Recettes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--acc:#E8590C;--acc2:#FFF1E8;--ok:#2B8A3E;--ok2:#EBFBEE;--txt:#212529;--mut:#6C757D;--bg:#F8F9FA;--card:#FFFFFF;--bd:#E9ECEF;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{border:0;background:none;font-size:24px;padding:0 6px 0 0;color:var(--acc);display:none}
main{padding:14px 14px 96px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:21px}
nav button.on{color:var(--acc);font-weight:600}
h2{font-size:17px;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 6px;text-align:center;font-size:14px;font-weight:600;cursor:pointer}
.tile .e{font-size:30px;display:block;margin-bottom:6px}
.tile:active{background:var(--acc2)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;background:var(--acc);color:#fff;cursor:pointer}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.ok{background:var(--ok2);color:var(--ok)}
.btn.ghost{background:#fff;border:1px solid var(--bd);color:var(--txt)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.surprise{width:100%;padding:16px;font-size:17px;margin-bottom:6px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);display:flex;gap:12px;align-items:center;padding:8px;cursor:pointer}
.card img,.card .ph{width:74px;height:74px;border-radius:10px;object-fit:cover;flex:none;background:var(--acc2);display:flex;align-items:center;justify-content:center;font-size:32px}
.card .t{font-weight:600;font-size:15px}
.card .s{color:var(--mut);font-size:13px;margin-top:3px}
.badge{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:20px;padding:2px 8px;font-size:11px;font-weight:600;margin-right:4px}
.badge.g{background:var(--ok2);color:var(--ok)}
.hero{margin:-14px -14px 12px;height:230px;background:var(--acc2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:80px}
.rt{font-size:22px;margin:4px 0 6px;font-weight:700}
.stats{display:flex;gap:10px;margin:12px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:10px;text-align:center}
.stat b{display:block;font-size:18px;margin-top:2px}
.stat small{color:var(--mut);font-size:11px}
.stepper{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:2px}
.stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--acc);background:#fff;color:var(--acc);font-size:20px;line-height:1}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ing{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.ing .row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--bd)}
.ing .row:last-child{border-bottom:0}
.ing .q{color:var(--acc);font-weight:600;text-align:right;white-space:nowrap}
.alt{font-size:13px;color:var(--ok);margin-top:3px}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:0}
ol.steps li{counter-increment:s;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 12px 12px 48px;margin-bottom:8px;position:relative;line-height:1.45}
ol.steps li:before{content:counter(s);position:absolute;left:12px;top:11px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.side{margin-bottom:12px}
.side h3{font-size:14px;margin:0 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.chip{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;margin-bottom:6px;font-size:14px;cursor:pointer}
.chip small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.chip.on{border-color:var(--ok);background:var(--ok2)}
.chip.on:after{content:" ✓";color:var(--ok);font-weight:700}
.note{background:#FFF9DB;border-radius:12px;padding:10px 12px;font-size:13px;color:#5C4813;margin:10px 0}
.banner{background:var(--ok2);border:1px solid #B2F2BB;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.loader{text-align:center;padding:40px;color:var(--mut)}
.spin{width:34px;height:34px;border:4px solid var(--acc2);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.weeknav b{font-size:15px}
.day{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
.day.today{border-color:var(--acc)}
.day .dh{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.meal{display:flex;gap:10px;align-items:center;border-top:1px solid var(--bd);padding:8px 0 2px;margin-top:8px}
.meal .mt{flex:1;cursor:pointer}
.meal .mt b{font-size:14px}
.meal .mt div{font-size:12px;color:var(--mut)}
.ib{border:0;background:none;font-size:19px;padding:4px;cursor:pointer}
.aisle{margin-bottom:14px}
.aisle h3{font-size:14px;color:var(--acc);margin:14px 0 6px}
.gi{font-weight:400;display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:6px}
.gi input{width:22px;height:22px;accent-color:var(--ok);flex:none;margin-top:1px}
.gi .gn{flex:1}
.gi .gn small{display:block;color:var(--mut);font-size:12px}
.gi.ck .gn{text-decoration:line-through;color:var(--mut)}
.seg{display:flex;background:var(--bd);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--acc)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=number],textarea,select{width:100%;padding:11px;border:1px solid #CED4DA;border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
textarea{min-height:110px}
.row2{display:flex;gap:10px}.row2>div{flex:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:20}
#modal.on{display:flex}
#modal .sheet{background:#fff;width:100%;max-width:720px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{margin-top:0}
.days{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.days button{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:10px;font-size:14px;text-align:left}
.days button.on{border-color:var(--acc);background:var(--acc2);color:var(--acc);font-weight:700}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#343A40;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
#toast.on{opacity:1}
.muted{color:var(--mut);font-size:13px}
</style>
</head>

const FR={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125};
function toNum(s){s=s.trim();let m;
 if(m=s.match(/^(\d+)\s*([½¼¾⅓⅔⅛])$/))return +m[1]+FR[m[2]];
 if(FR[s]!=null)return FR[s];
 if(m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/))return +m[1]+m[2]/m[3];
 if(m=s.match(/^(\d+)\/(\d+)$/))return m[1]/m[2];
 return parseFloat(s.replace(',','.'))}
function parseQty(s){const m=String(s||'').match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d+[.,]\d+|\d+\s*[½¼¾⅓⅔⅛]|\d+|[½¼¾⅓⅔⅛])/);
 if(!m)return null;let rest=s.slice(m[0].length),q2=null;const r=rest.match(/^\s*(?:-|–|à)\s*(\d+(?:[.,]\d+)?)/);
 if(r){q2=parseFloat(r[1].replace(',','.'));rest=rest.slice(r[0].length)}return{q:toNum(m[1]),q2,rest}}
function fmt(n){if(n>=10)return String(Math.round(n));const w=Math.floor(n),f=n-w;
 const opts=[[0,''],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];
 for(const [v,g] of opts)if(Math.abs(f-v)<.04){const W=v===1?w+1:w;return (W?W:'')+(g?(W?' ':'')+g:'')||'0'}
 return String(Math.round(n*10)/10).replace('.',',')}
function scaleM(m,f){if(!m||f===1)return m||'';return m.replace(/\d+\s+\d+\/\d+|\d+\/\d+|\d+[.,]\d+|\d+\s*[½¼¾⅓⅔⅛]|\d+|[½¼¾⅓⅔⅛]/g,x=>fmt(toNum(x)*f))}
function altFor(ing){const t=norm(ing.en||ing.fr);for(const [keys,alt,ex] of ALTS){if(ex&&t.includes(ex))continue;if(keys.some(k=>t.includes(norm(k))))return alt}return null}

async function gtx(text){const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=fr&dt=t&q='+encodeURIComponent(text));
 if(!r.ok)throw new Error('gtx');const j=await r.json();return j[0].map(s=>s[0]).join('')}
async function mymem(text){const r=await fetch('https://api.mymemory.translated.net/get?langpair=en|fr&q='+encodeURIComponent(text));
 const j=await r.json();if(+j.responseStatus!==200)throw new Error('mm');return j.responseData.translatedText}
async function tr1(t){try{return await gtx(t)}catch(e){try{return await mymem(t)}catch(e2){return null}}}
async function trLines(lines){const out=lines.map(l=>l||''),idx=[];let failed=false;
 lines.forEach((l,i)=>{if(l&&/[a-z]{2,}/i.test(l))idx.push(i)});
 const chunks=[];let cur=[],len=0;
 for(const i of idx){const L=lines[i].length;if(len+L>1400&&cur.length){chunks.push(cur);cur=[];len=0}cur.push(i);len+=L+1}
 if(cur.length)chunks.push(cur);
 await Promise.all(chunks.map(async ch=>{const res=await tr1(ch.map(i=>lines[i].replace(/\s*\n\s*/g,' ')).join('\n'));
  const parts=res?res.split('\n'):null;
  if(parts&&parts.length===ch.length)ch.forEach((i,k)=>out[i]=parts[k].trim());
  else await Promise.all(ch.map(async i=>{const t=await tr1(lines[i]);if(t==null)failed=true;out[i]=(t??lines[i]).trim()}))}));
 return{out,failed}}
const PRE_M=[[/\b(tbsp|tblsp|tbls|tbs|tbsps)\b\.?/gi,'tablespoon'],[/\btsps?\b\.?/gi,'teaspoon'],[/\bto taste\b/gi,'au goût'],[/\bto serve\b/gi,'pour servir'],[/\bfor frying\b/gi,'pour la friture'],[/\bto garnish|garnish\b/gi,'pour garnir'],[/\bas required|as needed\b/gi,'au besoin'],[/\bpinch(es)?\b/gi,'pincée'],[/\bdash\b/gi,'trait'],[/\bdrizzle\b/gi,'filet'],[/\bsprinkl(e|ing)\b/gi,'pincée']];
const preM=s=>{s=PRE_M.reduce((a,[r,v])=>a.replace(r,v),s||'').trim();return /^(pincée|trait|filet)/i.test(s)?'1 '+s:s};
const fixU=s=>(s||'').replace(/cuill[eè]res?\s+à\s+(café|thé)/gi,'c. à thé').replace(/cuill[eè]res?\s+à\s+soupe/gi,'c. à soupe').replace(/^1 1 /,'1 ');

function splitSteps(t){let p=String(t||'').split(/\r?\n+/).map(s=>s.trim()).filter(s=>s&&!/^(step\s*\d+[:.]?|\d+[.)]?)$/i.test(s));

 if(p.length<=2&&p.join(' ').length>350){const sents=p.join(' ').match(/[^.!?]+[.!?]+["')]?(\s|$)|[^.!?]+$/g)||[];p=[];let c='';

function estimate(text,nIng,nSteps){let sum=0,m;const re=/(\d+(?:\.\d+)?)(?:\s*(?:-|–|to)\s*(\d+(?:\.\d+)?))?\s*(minutes?|mins?|hours?|hrs?)\b/gi;

 let t=sum?10+nIng+Math.min(sum,300):15+nIng*2+nSteps*3;return{time:Math.max(10,Math.round(t/5)*5),overnight:/overnight|24 hours|the night before/i.test(text)}}
async function buildRecipe(m){const ings=[];for(let i=1;i<=20;i++){const n=(m['strIngredient'+i]||'').trim();if(n)ings.push({en:n,mEn:(m['strMeasure'+i]||'').trim()})}

 <div class="stat"><small>🍽️ Portions</small><div class="stepper"><button onclick="setP(-1)">−</button><b>${portions}</b><button onclick="setP(1)">+</button></div></div></div>
 <div class="actions"><button class="btn ${favs[r.id]?'':'sec'}" onclick="togFav()">${favs[r.id]?'⭐ Favori':'☆ Favori'}</button><button class="btn sec" onclick="planModal()">📅 Planifier</button><button class="btn ok" onclick="markDone()">✅ Faite!</button></div>
 <h2>Ingrédients</h2><div class="ing">${r.ings.map(i=>{const a=altFor(i);return`<div class="row"><div>${esc(i.fr)}${a?`<div class="alt">💡 Alternative : ${esc(a)}</div>`:''}</div><div class="q">${esc(scaleM(i.m,f))}</div></div>`}).join('')}</div>
 <h2>Étapes</h2><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
 ${r.notes?`<h2>Notes</h2><div class="note">${esc(r.notes)}</div>`:''}
 <h2>Accompagnements suggérés</h2><div class="muted" style="margin-bottom:8px">Touche pour sélectionner — ils seront ajoutés à ta liste d’épicerie si tu planifies le repas.</div>${sides}
 ${r.est||r.estServ?'<p class="muted">Le site source ne donne pas '+(r.est?'le temps':'')+(r.est&&(r.estServ||r.src==='mdb')?' ni ':'')+(r.estServ||r.src==='mdb'?'les portions':'')+' : valeur estimée.</p>':''}
 ${r.src==='user'?`<div class="actions" style="grid-template-columns:1fr 1fr;margin-top:14px"><button class="btn ghost" onclick="go('edit',{id:'${r.id}'})">✏️ Modifier</button><button class="btn ghost" onclick="delMine('${r.id}')">🗑️ Supprimer</button></div>`:''}`}
function setP(d){portions=Math.max(1,Math.min(24,portions+d));render()}
function togSide(el,i){const s=window._SL[i];selSides.has(s)?selSides.delete(s):selSides.add(s);el.classList.toggle('on')}
function togFav(){if(favs[R.id]){delete favs[R.id];toast('Retiré des favoris')}else{favs[R.id]=R;toast('⭐ Ajouté aux favoris')}save();render()}
function markDone(r=R){const d=done[r.id]||{r,dates:[]};d.r=r;d.dates.push(iso(new Date()));done[r.id]=d;save();toast('✅ Ajoutée à tes recettes déjà faites');if(S.view==='recipe'||S.view==='week')render()}
function planModal(){const days=[...Array(14)].map((_,i)=>iso(addDays(new Date(),i)));let sel=planTarget||days[0];
 openModal(`<h2>📅 Planifier « ${esc(R.title)} »</h2><label>Jour</label><div class="days">${days.map(d=>`<button data-d="${d}" class="${d===sel?'on':''}">${dayLabel(d)}</button>`).join('')}</div>
 <label>Portions : <b id="mp">${portions}</b></label><div class="muted">${selSides.size?'Accompagnements : '+[...selSides].map(s=>s.split('|')[0]).join(', '):'Aucun accompagnement sélectionné (tu peux en choisir sous la recette).'}</div><br>
 <button class="btn full" id="mok">Ajouter au menu</button>`);
 document.querySelectorAll('.days button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.days button').forEach(x=>x.classList.remove('on'));b.classList.add('on');sel=b.dataset.d});
 $('#mok').onclick=()=>{addToPlan(sel,true)}}
function addToPlan(date,fromModal){(plan[date]=plan[date]||[]).push({r:R,portions,sides:[...selSides]});save();planTarget=null;
 toast('📅 Ajouté à '+dayLabel(date));if(fromModal)closeModal();else{wkOff=Math.round((weekStart(fromIso(date))-weekStart(new Date()))/6048e5);go('week')}}

function weekDays(){const ws=addDays(weekStart(new Date()),wkOff*7);return[...Array(7)].map((_,i)=>iso(addDays(ws,i)))}
function weekNav(){const d=weekDays();return`<div class="weeknav"><button class="btn sm ghost" onclick="wkOff--;render()">◀</button><b>${wkOff===0?'Cette semaine':wkOff===1?'Semaine prochaine':'Semaine du '+dayLabel(d[0]).replace(/^\S+ /,'')}</b><button class="btn sm ghost" onclick="wkOff++;render()">▶</button></div>`}
function vWeek(app){const today=iso(new Date());
 app.innerHTML=weekNav()+weekDays().map(d=>`<div class="day ${d===today?'today':''}"><div class="dh">${dayLabel(d)}<button class="btn sm sec" onclick="pickModal('${d}')">➕ Repas</button></div>
 ${(plan[d]||[]).map((e,i)=>`<div class="meal"><div class="mt" onclick="openPlanned('${d}',${i})"><b>${esc(e.r.title)}</b><div>${e.portions} portions${e.sides.length?' · '+e.sides.map(s=>esc(s.split('|')[0])).join(', '):''}</div></div>
 <button class="ib" title="Faite" onclick="markDone(plan['${d}'][${i}].r)">✅</button><button class="ib" title="Retirer" onclick="rmPlan('${d}',${i})">🗑️</button></div>`).join('')}</div>`).join('')+
 `<button class="btn full" onclick="go('groc')">🛒 Voir la liste d’épicerie de la semaine</button>`}
function openPlanned(d,i){const e=plan[d][i];R=e.r;portions=e.portions;selSides=new Set(e.sides);go('recipe',{id:e.r.id})}
function rmPlan(d,i){plan[d].splice(i,1);if(!plan[d].length)delete plan[d];save();render()}
function pickModal(d){const opts=[...Object.values(favs),...Object.values(mine),...Object.values(done).map(x=>x.r)];const seen=new Set(),u=opts.filter(r=>!seen.has(r.id)&&seen.add(r.id));
 openModal(`<h2>Ajouter un repas — ${dayLabel(d)}</h2><div class="actions" style="grid-template-columns:1fr 1fr"><button class="btn" id="pk1">🔎 Chercher</button><button class="btn sec" id="pk2">🎲 Surprise</button></div>
 <h2>Favoris, mes recettes et déjà faites</h2>${u.length?`<div class="list">${u.map(r=>`<div class="card" data-id="${r.id}">${r.img?`<img src="${esc(r.img)}/preview" onerror="this.onerror=null;this.src='${esc(r.img)}'" alt="">`:'<div class="ph">🍽️</div>'}<div class="t">${esc(r.title)}</div></div>`).join('')}</div>`:'<div class="muted">Rien encore. Utilise « Chercher ».</div>'}`);
 $('#pk1').onclick=()=>{hideModal();planTarget=d;go('home')};
 $('#pk2').onclick=async()=>{hideModal();planTarget=d;await surprise()};
 document.querySelectorAll('#sheet .card').forEach(c=>c.onclick=()=>{const r=u.find(x=>x.id===c.dataset.id);R=r;portions=r.servings||4;selSides=new Set();hideModal();planTarget=d;go('recipe',{id:r.id})})}

/* Épicerie */
const AISLES=[['Garde-manger (à vérifier)',/^(sel|poivre|poivre noir|sel et poivre|eau|eau chaude|eau froide|huile|huile d'olive|huile vegetale|huile de canola|sucre|farine|farine tout usage)$/],
 ['Épicerie',/beurre d'arachide|lait de coco|bouillon|sauce|vinaigre|ketchup|moutarde|mayonnaise|conserve|\bpates\b|spaghetti|nouille|\briz\b|couscous|boulgour|orzo|lentille|pois chiche|haricots? (noir|rouge|blanc)|feves|tortilla|pain|pita|naan|baguette|chapelure|miel|sirop|chocolat|olive/],
 ['Viandes et poissons',/poulet|boeuf|porc|bacon|jambon|saucisse|agneau|veau|dinde|canard|lapin|chevreuil|saumon|morue|thon|crevette|poisson|moule|petoncle|calmar|crabe|homard|chorizo|pancetta|prosciutto|viande|steak|cotelette/],
 ['Fruits et légumes',/oignon|\bail\b|tomate|carotte|celeri|poivron|patate|pomme|laitue|epinard|chou|brocoli|courgette|aubergine|champignon|citron|lime|avocat|concombre|persil|coriandre fraiche|basilic|menthe|aneth|gingembre|echalote|poireau|haricots? verts?|asperge|mais en epi|bok choy|radis|betterave|panais|navet|banane|fraise|bleuet|mangue|orange|piment frais|jalapeno|romarin|ciboulette|roquette|fenouil|courge|edamame|brocolini|gombo|herbes fraiches|feuilles|^coriandre$/],
 ['Produits laitiers et œufs',/lait|creme|beurre|fromage|yogourt|yaourt|oeuf|parmesan|mozzarella|feta|cheddar|ricotta|mascarpone|paneer|halloumi/],
 ['Épices et assaisonnements',/cumin|paprika|curcuma|cannelle|origan|thym|cari|curry|piment|muscade|clou|laurier|coriandre|graine|assaisonnement|epice|garam|chili|cayenne|poudre|za'atar|safran|cardamome/]];
function aisleOf(n){const t=norm(n);for(const [a,re] of AISLES)if(re.test(t))return a;return'Épicerie'}
function buildGroc(days){const items={};
 const add=(name,m,from)=>{m=(m||'').replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim();const key=norm(name).replace(/s$/,'');if(!key)return;const it=items[key]=items[key]||{name,amts:{},free:[],from:new Set()};it.from.add(from);
  const p=parseQty(m);if(p&&p.q2==null){const u=p.rest.trim();const uk=norm(u).replace(/s\b/g,'');(it.amts[uk]=it.amts[uk]||{q:0,u}).q+=p.q}else if(m&&m.trim())it.free.push(m.trim())};
 days.forEach(d=>(plan[d]||[]).forEach(e=>{const f=e.portions/(e.r.servings||4);e.r.ings.forEach(i=>add(i.fr,scaleM(i.m,f),e.r.title));
  e.sides.forEach(s=>{const [n,,ings]=s.split('|');(ings||'').split(';').forEach(x=>add(cap(x.trim()),'',n))})}));
 return Object.entries(items).map(([k,it])=>({k,name:it.name,qty:[...Object.values(it.amts).map(a=>fmt(a.q)+(a.u?' '+a.u:'')),...new Set(it.free)].join(' + '),from:[...it.from].join(', '),aisle:aisleOf(it.name)}))}
function vGroc(app){const days=weekDays(),wk=days[0],g=groc[wk]=groc[wk]||{ck:{},extra:[]};const list=buildGroc(days);
 g.extra.forEach((x,i)=>list.push({k:'x'+i+norm(x),name:x,qty:'',from:'Ajout manuel',aisle:'Ajouts manuels',xi:i}));
 const order=[...AISLES.map(a=>a[0]).filter(a=>!a.startsWith('Garde')),'Ajouts manuels','Garde-manger (à vérifier)'];
 const nMeals=days.reduce((s,d)=>s+(plan[d]||[]).length,0);
 app.innerHTML=weekNav()+`<div class="muted" style="margin-bottom:10px">${nMeals} repas planifié(s) cette semaine</div>
 <div class="row2" style="margin-bottom:6px"><div><input type="text" id="gx" placeholder="Ajouter un article…"></div><button class="btn" style="flex:none" onclick="addX('${wk}')">➕</button></div>
 ${list.length?order.map(a=>{const its=list.filter(x=>x.aisle===a).sort((x,y)=>x.name.localeCompare(y.name));if(!its.length)return'';
  return`<div class="aisle"><h3>${a}</h3>${its.map(x=>`<label class="gi ${g.ck[x.k]?'ck':''}"><input type="checkbox" ${g.ck[x.k]?'checked':''} onchange="ckG('${wk}',${list.indexOf(x)},this)"><div class="gn">${esc(x.name)}${x.qty?' — <b>'+esc(x.qty)+'</b>':''}<small>${esc(x.from)}</small></div>${x.xi!=null?`<button class="ib" onclick="event.preventDefault();rmX('${wk}',${x.xi})">✖</button>`:''}</label>`).join('')}</div>`}).join('')+
  `<div class="actions" style="grid-template-columns:1fr 1fr"><button class="btn sec" onclick="shareG()">📤 Partager / copier</button><button class="btn ghost" onclick="groc['${wk}'].ck={};save();render()">↺ Tout décocher</button></div>`
 :'<div class="empty">Ta liste est vide.<br>Planifie des repas dans l’onglet Semaine.</div>'}`;
 $('#gx').onkeydown=e=>{if(e.key==='Enter')addX(wk)};window._gl=list}
function ckG(wk,i,el){const k=window._gl[i].k;groc[wk].ck[k]=el.checked;save();el.parentElement.classList.toggle('ck',el.checked)}
function addX(wk){const v=$('#gx').value.trim();if(!v)return;groc[wk].extra.push(v);save();render()}
function rmX(wk,i){groc[wk].extra.splice(i,1);save();render()}
async function shareG(){const wk=weekDays()[0],g=groc[wk];const txt='🛒 Épicerie — semaine du '+dayLabel(wk)+'\n\n'+window._gl.filter(x=>!g.ck[x.k]).map(x=>'☐ '+x.name+(x.qty?' — '+x.qty:'')).join('\n');
 try{if(navigator.share)await navigator.share({title:'Liste d’épicerie',text:txt});else{await navigator.clipboard.writeText(txt);toast('Liste copiée')}}catch(e){}}

/* Favoris et carnet */
function vFavs(app){const l=Object.values(favs);app.innerHTML=l.length?`<div class="list">${l.map(cardH).join('')}</div>`:'<div class="empty">⭐ Aucun favori pour l’instant.<br>Touche « Favori » sur une recette.</div>'}
function vBook(app){const my=Object.values(mine),dn=Object.values(done).sort((a,b)=>b.dates.at(-1).localeCompare(a.dates.at(-1)));
 app.innerHTML=`<div class="seg"><button class="${bookTab==='mine'?'on':''}" onclick="bookTab='mine';render()">Mes recettes (${my.length})</button><button class="${bookTab==='done'?'on':''}" onclick="bookTab='done';render()">Déjà faites (${dn.length})</button></div>`+
 (bookTab==='mine'?`<button class="btn full" style="margin-bottom:12px" onclick="go('edit',{})">➕ Ajouter une recette</button>`+(my.length?`<div class="list">${my.map(cardH).join('')}</div>`:'<div class="empty">Aucune recette personnelle.</div>')
 :(dn.length?`<div class="list">${dn.map(d=>cardH(d.r).replace('</div></div></div>',`</div><div class="s">Faite ${d.dates.length} fois · dernière fois : ${dayLabel(d.dates.at(-1))}</div></div></div>`)).join('')}</div>`:'<div class="empty">Touche « ✅ Faite! » sur une recette pour la retrouver ici.</div>'))+
 `<h2>Sauvegarde</h2><div class="muted">Tes données sont gardées sur ton téléphone. Fais une copie de temps en temps.</div><br>
 <div class="actions" style="grid-template-columns:1fr 1fr"><button class="btn ghost" onclick="exportData()">💾 Exporter</button><button class="btn ghost" onclick="$('#imp').click()">📂 Importer</button></div><input type="file" id="imp" accept=".json" hidden onchange="importData(this)">`}
function vEdit(app){const r=S.id?mine[S.id]:null;const opt=(arr,v)=>arr.map(x=>`<option value="${x.id}" ${x.id===v?'selected':''}>${x.n}</option>`).join('');
 app.innerHTML=`<label>Nom de la recette</label><input type="text" id="e_t" value="${esc(r?.title)}">
 <div class="row2"><div><label>Catégorie</label><select id="e_p">${opt(PROTEINS,r?.protein)}</select></div><div><label>Saveur</label><select id="e_f">${opt(FLAVORS.filter(f=>f.id!=='all'),r?.flavor)}</select></div></div>
 <div class="row2"><div><label>Portions</label><input type="number" id="e_s" min="1" value="${r?.servings||4}"></div><div><label>Temps (min)</label><input type="number" id="e_m" min="1" value="${r?.time||30}"></div></div>
 <label>Ingrédients (un par ligne)</label><textarea id="e_i" placeholder="2 tasses de farine&#10;Sel : au goût&#10;3 gousses d'ail">${esc(r?r.ings.map(i=>i.m?i.m+' '+i.fr:i.fr).join('\n'):'')}</textarea>
 <label>Étapes (une par ligne)</label><textarea id="e_st">${esc(r?r.steps.join('\n'):'')}</textarea>
 <label>Lien d’une photo (facultatif)</label><input type="text" id="e_img" value="${esc(r?.img)}" placeholder="https://…">
 <label>Notes (facultatif)</label><textarea id="e_n" style="min-height:60px">${esc(r?.notes)}</textarea><br><br>
 <button class="btn full" onclick="saveMine('${r?r.id:''}')">💾 Enregistrer</button>`}
const UNITS=/^(tasses?|c\.\s?à\s?(soupe|thé|café)|c\.à\.s\.?|c\.à\.t\.?|cuill[eè]res?\s+à\s+(soupe|thé|café)|ml|cl|dl|l|g|kg|lb|lbs|oz|c\. à c\.|c\. à s\.|cs|cc|pincées?|gousses?|boîtes?|conserves?|tranches?|paquets?|bottes?|poignées?|filets?|morceaux?)\b\.?/i;
function parseUserIng(line){line=line.trim();let m;if(m=line.match(/^(.+?)\s*:\s*(.+)$/))return{fr:cap(m[1].trim()),m:m[2].trim()};
 const p=parseQty(line);if(!p)return{fr:cap(line),m:''};let rest=p.rest.trim(),q=line.slice(0,line.length-p.rest.length).trim();
 const u=rest.match(UNITS);if(u){q+=' '+u[0];rest=rest.slice(u[0].length).trim()}const pa=rest.match(/^\([^)]*\)/);if(pa){q+=' '+pa[0];rest=rest.slice(pa[0].length).trim()}rest=rest.replace(/^(de\s+|d['’]\s*)/i,'');return{fr:cap(rest),m:q}}
function saveMine(id){const t=$('#e_t').value.trim();if(!t){toast('Donne un nom à ta recette');return}id=id||'u_'+Date.now();
 const r={id,src:'user',title:t,protein:$('#e_p').value,flavor:$('#e_f').value,servings:+$('#e_s').value||4,time:+$('#e_m').value||30,est:false,
  ings:$('#e_i').value.split('\n').filter(x=>x.trim()).map(parseUserIng),steps:$('#e_st').value.split('\n').map(x=>x.trim().replace(/^\d+[.)]\s*/,'')).filter(Boolean),img:$('#e_img').value.trim(),notes:$('#e_n').value.trim()};
 mine[id]=r;if(favs[id])favs[id]=r;save();R=r;portions=r.servings;selSides=new Set();toast('💾 Recette enregistrée');history.replaceState({view:'recipe',id},'');S={view:'recipe',id};render()}
function delMine(id){if(!confirm('Supprimer cette recette?'))return;delete mine[id];delete favs[id];save();history.back()}
function exportData(){const b=new Blob([JSON.stringify({favs,done,mine,plan,groc},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mes-recettes-sauvegarde-'+iso(new Date())+'.json';a.click()}
function importData(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);favs=d.favs||{};done=d.done||{};mine=d.mine||{};plan=d.plan||{};groc=d.groc||{};save();toast('📂 Données restaurées');render()}).catch(()=>toast('Fichier invalide'))}

/* Démarrage */
history.replaceState(S,'');render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
